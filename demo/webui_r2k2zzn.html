        <div class='row'>

            <span style='float:left;'>
              <input id='ui_btn_random' type='button' value='random' onclick='ui_input("ui_btn_random")'>
            </span>
          </div>

          <div class='three columns'>

            <span style='float:right;'>preset:</span>

                <option value='e'>xxx</option>

          <div class='one columns'>
            <span style='float:right;'>ny:</span>

          </div>

          <div class='six columns'>
            &nbsp;
          </div>
        </div>

        <div class='row'>
          <div class='one columns'>
            <span style='float:right;'>s0:</span>
          </div>

          <div class='two columns'>
            <input type='text' id='ui_s0' name='s0' style='max-width:100%;'></input>
          </div>

          </div>

        </div>

        <div class='row'>
          <div class='twelve columns'>
            <span>paths</span>
          </div>
        </div>

        <div class='row'>
          <div class='twelve columns'>
            <textarea class='u-full-width' id='ui_path' style='max-width:100%; height:25em;'></textarea>
          </div>
        </div>

        <div class='row'>
          <div class='four columns'>
            <input id='ui_btn_render' type='button' value='render' onclick='ui_input("ui_btn_render")'>
          </div>

          <div class='four columns'>
            <input id='ui_btn_solve' type='button' value='solve' onclick='ui_input("ui_btn_solve")'>
          </div>

          <div class='four columns'>
            <input id='ui_btn_dl' type='button' value='dl' onclick='ui_input("ui_btn_dl")'>
